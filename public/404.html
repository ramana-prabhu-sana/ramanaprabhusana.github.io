<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Page not found - Ramana Prabhu Sana</title>
    <!-- Redirect to home after a moment so accidental deep links still land on the portfolio. -->
    <meta http-equiv="refresh" content="3; url=/" />
    <style>
      html, body { background: #0a0a0f; color: #f8fafc; margin: 0; min-height: 100%; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .wrap { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
      .card { max-width: 32rem; text-align: center; }
      .eyebrow { color: #a3e635; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; }
      h1 { font-size: 2.5rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 1rem 0 1.25rem; }
      p { color: rgba(255,255,255,0.75); line-height: 1.6; margin: 0 0 1.75rem; }
      a.cta { display: inline-flex; align-items: center; gap: 0.5rem; background: #a3e635; color: #07070D; padding: 0.75rem 1.25rem; border-radius: 0.75rem; text-decoration: none; font-weight: 500; }
      a.cta:hover { background: #bef264; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="eyebrow">404 - Page not found</div>
        <h1>This page doesn't exist.</h1>
        <p>Sending you back to the portfolio in 3 seconds. Click below if you'd rather go now.</p>
        <a class="cta" href="/">Back to home</a>
      </div>
    </div>
  </body>
</html>
